spring:
  application:
    name: back_end

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  jwt:
    secret: vmfhaltmskdlstkfkdgodyroqkfwkdbalroqkfwkdbalaaaaaaaaaaaaaaaabbbbb

#  autoconfigure:
#    exclude:
#      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace

data:
  rest:
    api:
      key: ${DATA_REST_API_KEY}

safety:
  rest:
    api:
      key: ${SAFETY_REST_API_KEY}

emergency:
  rest:
    api:
      key: ${EMERGENCY_REST_API_KEY}

cloud:
  aws:
    region: ap-northeast-2

    s3:
      bucket: ${AWS_BUCKET}

    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}

kakao:
  rest:
    api:
      key: ${KAKAO_REST_API_KEY}

file:
  upload-path: uploads
---
server:
  port: 8080

spring:
  profiles:
    active: local
    group:
      local:
        - common
      prod:
        - common
---
# "---" 파일 분리 역할
spring:
  config:
    activate:
      on-profile: common
      #공통 설정 파일 기록

---
spring:
  config:
    activate:
      on-profile: local_db
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/runner_db
    username: ${DB_USER:root}
    password: ${DB_PW:1111}

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        show_sql: true
        format_sql: true

    database-platform: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

  #  sql:
  #    init:
  #      mode: always  # data.sql

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://db:3307/runner_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:1111}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update   # 최초 개발 단계에만 update 권장 → 생성 후 validate로 변경
    properties:
      hibernate:
        show_sql: true
        format_sql: true

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${RDS_ENDPOINT:my-prod-database}:3306/runner_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate # 운영은 validate 고정
    properties:
      hibernate:
        show_sql: false

app:
  allowed-origins: ${ALLOWED_ORIGINS:https://YOUR_DOMAIN}